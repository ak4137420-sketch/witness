<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>witness</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #21262d; --text: #e6edf3;
    --dim: #8b949e; --ok: #3fb950; --bad: #f85149; --warn: #d29922; --blue: #58a6ff;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff; --panel: #f6f8fa; --line: #d0d7de; --text: #1f2328;
      --dim: #636c76; --ok: #1a7f37; --bad: #cf222e; --warn: #9a6700; --blue: #0969da;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  code, .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 80px; }

  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -.2px; }
  .repo { color: var(--dim); font-size: 12px; }

  .banner {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 14px 16px; border-radius: 8px; margin: 18px 0;
    border: 1px solid var(--line); background: var(--panel);
  }
  .banner.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 9%, var(--panel)); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); flex: none; }
  .bad .dot { background: var(--bad); }
  .verdict { font-weight: 600; font-size: 15px; }
  .banner .meta { color: var(--dim); font-size: 12px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .stat b { display: block; font-size: 20px; font-weight: 600; }
  .stat span { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }

  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  button {
    font: inherit; padding: 7px 13px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
  }
  button:hover { border-color: var(--blue); }
  button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  input {
    font: inherit; padding: 7px 10px; border-radius: 6px; flex: 1 1 180px;
    min-width: 0; border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }

  .problems { border: 1px solid var(--bad); border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; background: var(--panel); }
  .problems h2 { font-size: 13px; margin: 0 0 8px; color: var(--bad); text-transform: uppercase; letter-spacing: .5px; }
  .problems li { font-family: ui-monospace, Consolas, monospace; font-size: 12px; margin-bottom: 3px; }

  h2.section { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--dim); margin: 26px 0 10px; }

  .entry { display: flex; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
  .idx { color: var(--dim); font-size: 12px; min-width: 30px; text-align: right; padding-top: 2px; font-family: ui-monospace, Consolas, monospace; }
  .body { flex: 1; min-width: 0; }
  .summary { overflow-wrap: anywhere; }
  .sub { color: var(--dim); font-size: 12px; margin-top: 3px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .tag { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 11px; }
  .tag.regression { color: var(--warn); }
  .files { margin-top: 5px; display: flex; gap: 4px; flex-wrap: wrap; }
  .file { font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: var(--dim); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
  .hash { color: var(--dim); font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
  .open { background: none; border: none; color: var(--blue); cursor: pointer; padding: 0; font-size: 12px; }
  pre { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; overflow-x: auto; font-size: 12px; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 16px; font-size: 13px; display: none; max-width: 90vw; }
  .toast.err { border-color: var(--bad); color: var(--bad); }
  footer { color: var(--dim); font-size: 12px; margin-top: 34px; border-top: 1px solid var(--line); padding-top: 14px; }
  .dirty { color: var(--warn); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>witness</h1>
    <span class="repo mono" id="repo"></span>
  </header>

  <div class="banner" id="banner">
    <span class="dot"></span>
    <span class="verdict" id="verdict">checking…</span>
    <span class="meta" id="meta"></span>
  </div>

  <div class="stats" id="stats"></div>
  <div class="bar">
    <button class="primary" data-action="verify">Verify</button>
    <button data-action="report">Write report</button>
    <input id="actor" aria-label="Actor for the recorded change (optional)" placeholder="actor (optional)" maxlength="80">
    <input id="summary" aria-label="Summary of the change to record" placeholder="record a change… (summary)" maxlength="200">
    <button data-action="record">Record</button>
  </div>
  <div class="bar">
    <input id="regressOf" aria-label="Entry number to mark as regressed" placeholder="mark entry #… as regressed" inputmode="numeric">
    <button data-action="regress">Regress</button>
    <span class="repo">refreshes every 10s</span>
  </div>

  <div id="problems"></div>
  <h2 class="section">Chain — newest first</h2>
  <div id="chain"></div>

  <footer id="foot"></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ago = (iso) => {
  const d = (Date.now() - new Date(iso)) / 1000;
  if (!isFinite(d)) return '';
  if (d < 0) return 'just now';
  if (d < 60) return Math.floor(d) + 's ago';
  if (d < 3600) return Math.floor(d / 60) + 'm ago';
  if (d < 86400) return Math.floor(d / 3600) + 'h ago';
  return Math.floor(d / 86400) + 'd ago';
};
let toastTimer;
function toast(msg, isErr) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast' + (isErr ? ' err' : '');
  t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = 'none'; }, 5000);
}

function render(s) {
  $('#repo').textContent = s.repo;
  $('#banner').className = 'banner' + (s.ok ? '' : ' bad');
  $('#verdict').textContent = s.ok ? 'CHAIN INTACT' : 'TAMPERING DETECTED';
  $('#meta').textContent = s.checked + ' entries · signed by ' +
    (s.signers.length ? s.signers.join(', ') : 'no key');

  $('#stats').innerHTML = [
    ['Entries', s.stats.entries],
    ['Signers', s.stats.signers],
    ['Regressions', s.stats.regressions],
    ['Files touched', s.stats.filesTouched],
    ['Commits', s.git.commitCount],
  ].map(([k, v]) => '<div class="stat"><b>' + v + '</b><span>' + k + '</span></div>').join('');

  $('#problems').innerHTML = (s.problems && s.problems.length)
    ? '<div class="problems"><h2>Integrity problems</h2><ul>' +
      s.problems.map((p) => '<li>' + esc(p) + '</li>').join('') + '</ul></div>'
    : '';

  $('#chain').innerHTML = s.chain.length
    ? s.chain.map((e) => {
        const files = (e.files || []).slice(0, 8)
          .map((f) => '<span class="file">' + esc(f) + '</span>').join('');
        const more = (e.files || []).length > 8
          ? '<span class="file">+' + (e.files.length - 8) + '</span>' : '';
        return '<div class="entry">' +
          '<div class="idx">' + e.index + '</div>' +
          '<div class="body">' +
            '<div class="summary">' + esc(e.summary || '(no summary)') + '</div>' +
            '<div class="sub">' +
              '<span>' + esc(e.actor || '?') + '</span>' +
              '<span>' + ago(e.timestamp) + '</span>' +
              (e.signedBy ? '<span class="tag">key ' + esc(String(e.signedBy).slice(0, 8)) + '</span>' : '') +
              (e.action === 'regression' ? '<span class="tag regression">regressed #' + esc(String(e.regressionOf)) + '</span>' : '') +
              (e.sha ? '<span class="hash">' + esc(e.sha) + '</span>' : '') +
              '<button class="open" data-idx="' + e.index + '">details</button>' +
            '</div>' +
            (files ? '<div class="files">' + files + more + '</div>' : '') +
          '</div>' +
        '</div>';
      }).join('')
    : '<p class="repo">no entries yet</p>';

  $('#foot').innerHTML =
    'branch <b>' + esc(s.git.branch) + '</b>' +
    (s.git.head ? ' @ <span class="hash">' + esc(s.git.head) + '</span>' : '') +
    (s.git.dirty ? ' · <span class="dirty">' + s.git.dirty + ' uncommitted change(s)</span>' : '') +
    (s.git.remote ? '<br>remote: <span class="hash">' + esc(s.git.remote) + '</span>' : '') +
    (s.error ? '<br><span style="color:var(--bad)">' + esc(s.error) + '</span>' : '');
}

async function refresh() {
  try {
    const r = await fetch('/api/state', { cache: 'no-store' });
    render(await r.json());
  } catch (e) {
    $('#verdict').textContent = 'cannot reach the witness app';
  }
}

async function act(action) {
  const body = { action };
  if (action === 'record') {
    const summary = $('#summary').value.trim();
    if (!summary) return toast('a summary is required', true);
    body.summary = summary;
    body.actor = $('#actor').value.trim();
    $('#summary').value = '';
  }
  if (action === 'regress') {
    const of = $('#regressOf').value.trim();
    if (!/^\d+$/.test(of)) return toast('regress needs the entry number', true);
    body.of = of;
    $('#regressOf').value = '';
  }
  const r = await fetch('/api/action', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify(body),
  });
  const d = await r.json();
  if (d.state) render(d.state);
  toast(d.ok ? (d.result || 'done') : d.error, !d.ok);
}

document.addEventListener('click', async (ev) => {
  const a = ev.target.closest('[data-action]');
  if (a) return act(a.dataset.action);
  const o = ev.target.closest('.open');
  if (!o) return;
  const s = await (await fetch('/api/state', { cache: 'no-store' })).json();
  const e = s.chain.find((x) => String(x.index) === o.dataset.idx);
  if (e) alert(JSON.stringify(e, null, 2));
});

refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
